[project]
name = "finance-core"
version = "3.3.0"
description = "Local-first deterministic finance domain and data API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.121,<1",
  "pydantic>=2.11,<3",
  "uvicorn>=0.35,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["finance_core"]
